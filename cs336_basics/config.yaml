# data
input_file: ../data/train.bin
context_length: 2048
vocab_size: 10000

# model
d_model: 4096
num_heads: 8
num_layers: 8
d_ff: 10240
rope_theta: 10000.0

# train
batch_size: 32
lr: 1e-3
weight_decay: 0.1
beta1: 0.9
beta2: 0.99
grad_clip: 1.0
epoch: 5
warmup_steps: 200
checkpoint_path: ../checkpoint
resume: null
log_interval: 100
save_interval: 1000

